<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FEenabler Key Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 80px auto;
            padding: 20px;
            background: #0d1117;
            color: white;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #8b949e;
        }

        textarea {
            width: 100%;
            height: 180px;
            box-sizing: border-box;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #161b22;
            color: white;
            resize: vertical;
            font-family: monospace;
        }

        button {
            margin-top: 12px;
            padding: 10px 18px;
            border: 0;
            border-radius: 7px;
            background: #238636;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #2ea043;
        }

        #status {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>FEenabler Key Generator</h1>

    <p>Paste the copied PowerShell command below.</p>

    <textarea id="message" placeholder="Paste here..."></textarea>

    <br>

    <button id="submit">Submit</button>

    <div id="status"></div>

    <script>
        const message = document.getElementById("message");
        const submit = document.getElementById("submit");
        const status = document.getElementById("status");

        async function send() {
            const text = message.value.trim();

            if (!text) {
                status.textContent = "Please enter something.";
                return;
            }

            status.textContent = "Sending...";

            // Backend will go here later.
            console.log(text);

            status.textContent = "Submitted.";
            message.value = "";
        }

        submit.addEventListener("click", send);

        message.addEventListener("keydown", function(event) {
            if (event.key === "Enter" && event.ctrlKey) {
                send();
            }
        });
    </script>

</body>
</html>
