<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FEenabler</title>

    <style>
        body {
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 80px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 50px;
            box-sizing: border-box;
            padding: 12px 15px;
            background: #161b22;
            color: white;
            border: 1px solid #30363d;
            border-radius: 8px;
            resize: none;
            font-family: Arial, sans-serif;
            font-size: 15px;
            outline: none;
        }

        button {
            margin-top: 12px;
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            background: #238636;
            color: white;
            cursor: pointer;
        }

        #status {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>FEenabler</h1>

    <p>Paste your text below.</p>

    <textarea id="message" placeholder="Paste here..."></textarea>

    <br>

    <button id="submit">Submit</button>

    <div id="status"></div>

    <script>
        const message = document.getElementById("message");
        const submit = document.getElementById("submit");
        const status = document.getElementById("status");

        function send() {
            const text = message.value.trim();

            if (!text) {
                status.textContent = "Nothing entered.";
                return;
            }

            console.log(text);

            status.textContent = "Received.";
            message.value = "";
        }

        submit.addEventListener("click", send);

        message.addEventListener("keydown", function(event) {
            if (event.key === "Enter" && event.ctrlKey) {
                send();
            }
        });
    </script>

</body>
</html>
