name: Discord Notifier

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send message to Discord
        env:
          MESSAGE: ${{ github.event.comment.body || github.event.issue.title }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          jq -n \
            --arg content "$MESSAGE" \
            '{content: $content}' |
          curl -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d @-
