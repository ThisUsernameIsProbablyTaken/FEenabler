name: Discord Notifier

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Discord
        run: |
          curl -X POST \
          https://discord.com/api/webhooks/1555557490295308472/sgiYczPESzUGbCAAfYRWEAnCfQDm82I4tUnJem9-ivRlqFG0z_1xYidFHab6baO3z57g \
          -H 'Content-Type: application/json' \
          -d '{"content": "${github.event.comment.body || github.event.issue.title}"}'
